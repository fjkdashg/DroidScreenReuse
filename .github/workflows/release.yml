name: Build and Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          (yes || true) | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Read version code
        id: version
        run: |
          CODE=$(sed -n 's/^VERSION_CODE=//p' version.properties | tr -d '\r' | head -n 1)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$CODE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          {
            echo "## DroidScreenUse v${{ steps.version.outputs.code }}"
            echo
            echo "- 构建来源：\`${{ github.sha }}\`（\`${{ github.ref_name }}\`）"
            echo "- 构建时间：$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "### 本次变更"
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log --pretty=format:'- %h %s' "$PREV"..HEAD
            else
              git log -10 --pretty=format:'- %h %s'
            fi
            echo
            echo
            echo "### 下载"
            echo "资产：\`DroidScreenUse-v${{ steps.version.outputs.code }}-debug.apk\`（debug 构建，可直接安装）"
          } > release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.code }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "DroidScreenUse-v${VERSION}-debug.apk"
          TITLE="DroidScreenUse v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "DroidScreenUse-v${VERSION}-debug.apk" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
          else
            gh release create "$TAG" "DroidScreenUse-v${VERSION}-debug.apk" --title "$TITLE" --notes-file release_notes.md
          fi
