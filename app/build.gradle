plugins {
    id 'com.android.application'
}

// ---- 版本号自动递增：每次执行构建任务（assemble/bundle/package）都在上一版本号基础上 +1 ----
def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.canRead()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def requestedTaskNames = gradle.startParameter.taskNames.join(' ').toLowerCase()
def isApkBuild = requestedTaskNames.contains('assemble')
        || requestedTaskNames.contains('bundle')
        || requestedTaskNames.contains('package')
int buildVersionCode = 1
if (versionProps.getProperty('VERSION_CODE') != null) {
    buildVersionCode = versionProps.getProperty('VERSION_CODE') as int
}
if (isApkBuild) {
    buildVersionCode += 1
    versionProps.setProperty('VERSION_CODE', buildVersionCode.toString())
    versionPropsFile.withOutputStream { versionProps.store(it, 'auto-incremented on every build') }
}

android {
    namespace 'com.droidscreentimer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.droidscreentimer'
        minSdk 24
        targetSdk 34
        versionCode buildVersionCode
        versionName '1.0.' + buildVersionCode

        // 同时支持 ARM 与 x86 平台
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
